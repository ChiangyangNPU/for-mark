<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 背景浅色渐变：白底微带冷调，上白下浅灰蓝 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf2fa"/>
    </linearGradient>
    <!-- 前景蓝色渐变：取应用 accent #4a7cd4 色系，上亮下暗，用于 TMD 字标与箭头 -->
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E92ED"/>
      <stop offset="1" stop-color="#3866C2"/>
    </linearGradient>
    <!-- 图形投影：浅色底下用淡蓝灰投影，轻提层次 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2b4a8f" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- macOS Big Sur 风格 squircle 底（圆角半径约 22.4%）；淡描边保证浅色壁纸上边界可见 -->
  <rect x="4" y="4" width="1016" height="1016" rx="226"
        fill="url(#bg)" stroke="#d8e0ee" stroke-width="8"/>

  <g filter="url(#shadow)">
    <!-- TMD 字标 -->
    <text x="512" y="462" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, 'PingFang SC', Arial, sans-serif"
          font-size="320" font-weight="800" letter-spacing="10"
          fill="url(#fg)">TMD</text>

    <!-- 向下箭头 ↓（Markdown 标志元素，呼应 Type Markdown, Done.） -->
    <g stroke="url(#fg)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="512" y1="560" x2="512" y2="752"/>
      <polyline points="424,684 512,780 600,684"/>
    </g>
  </g>
</svg>
