<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>for-mark</title>
  </head>
  <body>
    <header class="toolbar">
      <span class="logo">for-mark</span>
      <span class="spacer"></span>
      <button id="sidebar-outline-btn" class="tool-btn" title="大纲面板">大纲</button>
      <button id="sidebar-files-btn" class="tool-btn" title="文件树 / 最近文件">文件</button>
      <button id="source-mode-btn" class="tool-btn" title="切换 源码 / 所见即所得 模式 (Cmd/Ctrl+E)">源码</button>
      <button id="find-btn" class="tool-btn" title="查找替换 (Cmd/Ctrl+F)">查找</button>
      <button id="import-btn" class="tool-btn" title="打开 .md 文件">打开</button>
      <button id="export-btn" class="tool-btn" title="保存 (Cmd/Ctrl+S)">保存</button>
      <button id="export-html-btn" class="tool-btn" title="导出为独立 HTML 文件">HTML</button>
      <span id="word-count" class="word-count">0 字</span>
      <button id="theme-toggle" class="theme-toggle" title="切换深色/浅色主题">🌙</button>
    </header>

    <div id="find-bar" class="find-bar" hidden>
      <input id="find-input" class="find-input" placeholder="查找" />
      <span id="find-count" class="find-count">0/0</span>
      <button id="find-prev" class="tool-btn" title="上一个 (Shift+Enter)">↑</button>
      <button id="find-next" class="tool-btn" title="下一个 (Enter)">↓</button>
      <input id="replace-input" class="find-input" placeholder="替换为" />
      <button id="replace-one" class="tool-btn">替换</button>
      <button id="replace-all" class="tool-btn">全部</button>
      <button id="find-close" class="tool-btn" title="关闭 (Esc)">✕</button>
    </div>

    <div class="workbench">
      <aside id="sidebar" class="sidebar" hidden>
        <div id="outline-panel" class="sidebar-panel" hidden>
          <div class="sidebar-title">大纲</div>
          <div id="outline-list" class="outline-list"></div>
        </div>
        <div id="files-panel" class="sidebar-panel" hidden>
          <div class="sidebar-title">
            文件
            <button id="open-folder-btn" class="tool-btn small" title="打开文件夹">＋文件夹</button>
          </div>
          <div class="sidebar-subtitle">最近打开</div>
          <div id="recent-list" class="file-list"></div>
          <div class="sidebar-subtitle" id="folder-title">文件夹</div>
          <div id="folder-tree" class="file-list"></div>
        </div>
      </aside>

      <main class="content">
        <div id="tab-bar" class="tab-bar"></div>
        <div class="page">
          <div id="editor"></div>
          <div id="src-editor" hidden></div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
