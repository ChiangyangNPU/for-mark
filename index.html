<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMD</title>
    <!-- 首帧引导：平台类 + 主题防闪，详见 public/boot.js -->
    <script src="./boot.js"></script>
  </head>
  <body>
    <!-- 单行顶栏（Mac/Windows 同构）：
         Mac 走 hiddenInset（红绿灯浮在左侧），功能按钮组靠右；
         Windows/Linux 走 hidden（自绘窗口按钮独占右缘），功能按钮组靠左且顺序反转；
         整行是拖拽区，文件名绝对居中 -->
    <header class="toolbar">
      <span id="win-title" class="win-title"></span>
      <div class="toolbar-left">
        <span id="word-count" class="word-count">0 字</span>
        <button
          id="sidebar-outline-btn"
          class="tool-btn"
          data-i18n="toolbar.outline"
          data-i18n-title="toolbar.outlineTitle"
        >
          大纲
        </button>
        <button
          id="source-mode-btn"
          class="tool-btn"
          data-i18n="toolbar.sourceMode"
          data-i18n-title="toolbar.sourceModeTitle"
        >
          源码
        </button>
        <button
          id="import-btn"
          class="tool-btn"
          data-i18n="toolbar.open"
          data-i18n-title="toolbar.openTitle"
        >
          打开
        </button>
        <button
          id="export-btn"
          class="tool-btn"
          data-i18n="toolbar.save"
          data-i18n-title="toolbar.saveTitle"
        >
          保存
        </button>
        <button id="more-btn" class="tool-btn" data-i18n-title="toolbar.more">⋯</button>
        <button id="theme-toggle" class="theme-toggle" data-i18n-title="toolbar.themeTitle">
          🌙
        </button>
      </div>
      <!-- Windows/Linux 自绘窗口控制：极简透明按钮（hover 高亮，关闭 hover 红） -->
      <div class="win-controls" aria-label="窗口控制">
        <button id="win-min" class="win-btn" tabindex="-1" aria-label="最小化">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5h10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button id="win-max" class="win-btn" tabindex="-1" aria-label="最大化/还原">
          <svg class="ic-max" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" />
          </svg>
          <svg class="ic-restore" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" />
            <path d="M2.5 2.5v-2h7v7h-2" fill="none" stroke="currentColor" />
          </svg>
        </button>
        <button id="win-close" class="win-btn win-close" tabindex="-1" aria-label="关闭">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
      </div>
    </header>

    <div id="more-menu" class="more-menu" hidden>
      <button id="menu-files-btn" class="menu-item" data-i18n="toolbar.files">文件</button>
      <button id="menu-find-btn" class="menu-item" data-i18n="toolbar.find">查找</button>
      <button id="menu-export-html-btn" class="menu-item" data-i18n="menu.exportHtml">
        导出 HTML
      </button>
      <button id="menu-insert-toc-btn" class="menu-item" data-i18n="menu.insertToc">
        插入目录
      </button>
      <div class="menu-sep"></div>
      <button id="menu-settings-btn" class="menu-item" data-i18n="toolbar.settings">设置</button>
    </div>

    <div id="context-menu" class="more-menu context-menu" hidden>
      <button class="menu-item" data-cm-action="cut" data-i18n="contextMenu.cut">剪切</button>
      <button class="menu-item" data-cm-action="copy" data-i18n="contextMenu.copy">复制</button>
      <button class="menu-item" data-cm-action="paste" data-i18n="contextMenu.paste">粘贴</button>
      <div class="menu-sep"></div>
      <button class="menu-item" data-cm-action="bold" data-i18n="contextMenu.bold">加粗</button>
      <button class="menu-item" data-cm-action="italic" data-i18n="contextMenu.italic">斜体</button>
      <button class="menu-item" data-cm-action="strike" data-i18n="contextMenu.strike">
        删除线
      </button>
      <button class="menu-item" data-cm-action="code" data-i18n="contextMenu.inlineCode">
        行内代码
      </button>
      <button class="menu-item" data-cm-action="link" data-i18n="contextMenu.link">链接…</button>
      <button class="menu-item" data-cm-action="remove-link" data-i18n="contextMenu.removeLink">
        移除链接
      </button>
    </div>

    <div id="qs-overlay" class="qs-overlay" hidden>
      <div class="qs-panel">
        <input
          id="qs-input"
          data-i18n-placeholder="qs.placeholder"
          placeholder="搜索文件名，回车打开"
        />
        <div id="qs-list" class="qs-list"></div>
      </div>
    </div>

    <div id="table-toolbar" class="table-toolbar" hidden>
      <button
        class="tt-btn"
        data-tt-action="row-after"
        data-i18n="tt.rowAdd"
        data-i18n-title="tt.rowAddTitle"
      >
        行+
      </button>
      <button
        class="tt-btn"
        data-tt-action="row-delete"
        data-i18n="tt.rowDel"
        data-i18n-title="tt.rowDelTitle"
      >
        行−
      </button>
      <button
        class="tt-btn"
        data-tt-action="col-after"
        data-i18n="tt.colAdd"
        data-i18n-title="tt.colAddTitle"
      >
        列+
      </button>
      <button
        class="tt-btn"
        data-tt-action="col-delete"
        data-i18n="tt.colDel"
        data-i18n-title="tt.colDelTitle"
      >
        列−
      </button>
      <div class="menu-sep"></div>
      <button
        class="tt-btn"
        data-tt-action="align-left"
        data-i18n="tt.alignLeft"
        data-i18n-title="tt.alignLeftTitle"
      >
        左
      </button>
      <button
        class="tt-btn"
        data-tt-action="align-center"
        data-i18n="tt.alignCenter"
        data-i18n-title="tt.alignCenterTitle"
      >
        中
      </button>
      <button
        class="tt-btn"
        data-tt-action="align-right"
        data-i18n="tt.alignRight"
        data-i18n-title="tt.alignRightTitle"
      >
        右
      </button>
    </div>

    <div id="settings-overlay" class="settings-overlay" hidden>
      <div class="settings-modal">
        <div class="settings-header">
          <span class="settings-title" data-i18n="settings.title">设置</span>
          <button id="settings-close" class="theme-toggle" data-i18n-title="settings.close">
            ✕
          </button>
        </div>

        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.language">界面语言</div>
          <label class="settings-option"
            ><input type="radio" name="set-lang" value="zh-CN" /><span>中文</span></label
          >
          <label class="settings-option"
            ><input type="radio" name="set-lang" value="en" /><span>English</span></label
          >
          <div class="settings-hint" data-i18n="settings.languageHint">切换后立即生效</div>
        </div>

        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.themePreset">主题</div>
          <label class="settings-option"
            ><input type="radio" name="set-preset" value="default" /><span
              data-i18n="settings.presetDefault"
              >简约白（默认）</span
            ></label
          >
          <label class="settings-option"
            ><input type="radio" name="set-preset" value="dark" /><span
              data-i18n="settings.presetDark"
              >深色</span
            ></label
          >
          <label class="settings-option"
            ><input type="radio" name="set-preset" value="sepia" /><span
              data-i18n="settings.presetSepia"
              >护眼米黄</span
            ></label
          >
          <label class="settings-option"
            ><input type="radio" name="set-preset" value="green" /><span
              data-i18n="settings.presetGreen"
              >护眼绿</span
            ></label
          >
          <div class="settings-hint" data-i18n="settings.themePresetHint">
            选择预设会同时应用其深浅模式；工具栏按钮可随时切换深浅
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.customCss">自定义 CSS</div>
          <textarea
            id="set-custom-css"
            class="settings-textarea"
            rows="6"
            data-i18n-placeholder="settings.customCssPlaceholder"
            placeholder="/* 自定义样式，例如：body { font-size: 18px; } */"
          ></textarea>
          <div class="settings-hint settings-row">
            <span data-i18n="settings.customCssHint">即时生效，保存后全局持久</span>
            <button id="css-reset-btn" class="tool-btn" data-i18n="settings.cssReset">
              恢复默认
            </button>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-label">
            <label class="settings-option">
              <input type="checkbox" id="set-linenos" />
              <span data-i18n="settings.lineNumbers">显示行号</span>
            </label>
          </div>
          <div class="settings-hint" data-i18n="settings.lineNumbersHint">
            源码模式左侧的行号与折叠标记（关闭后立即生效）
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-label">
            <label class="settings-option">
              <input type="checkbox" id="set-autosave" />
              <span data-i18n="settings.autosave">自动保存到文件</span>
            </label>
          </div>
          <div class="settings-hint" data-i18n="settings.autosaveHint">
            每 5 秒将已保存过的文件自动写回磁盘（桌面版可用）
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.imageStrategy">粘贴图片存储方式</div>
          <label class="settings-option"
            ><input type="radio" name="set-img" value="inline" /><span
              data-i18n="settings.imageInline"
              >内联到文档（data URL，无需保存文件）</span
            ></label
          >
          <label class="settings-option"
            ><input type="radio" name="set-img" value="assets" /><span
              data-i18n="settings.imageAssets"
              >保存到文档同目录 assets/ 文件夹（需先将文档保存）</span
            ></label
          >
          <div class="settings-hint" data-i18n="settings.imageAssetsHint">
            选择 assets 模式时，未保存过的文档会自动降级为内联模式
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.update">更新</div>
          <label class="settings-option">
            <input type="checkbox" id="set-auto-check-update" />
            <span data-i18n="settings.updateAutoCheck">启动时自动检查更新</span>
          </label>
          <div class="settings-hint" data-i18n="settings.updateAutoCheckHint">
            启动应用后自动检查新版本
          </div>
          <div class="settings-update-row">
            <button id="update-check-btn" class="update-check-btn" data-i18n="settings.updateCheck">
              检查更新
            </button>
            <span id="update-status" class="update-status"></span>
          </div>
          <button
            id="update-install-btn"
            class="update-install-btn"
            data-i18n="settings.updateInstall"
            hidden
          >
            立即重启
          </button>
        </div>
      </div>
    </div>

    <div id="find-bar" class="find-bar" hidden>
      <input
        id="find-input"
        class="find-input"
        data-i18n-placeholder="find.placeholder"
        placeholder="查找"
      />
      <span id="find-count" class="find-count">0/0</span>
      <button id="find-prev" class="tool-btn" data-i18n="find.prev" data-i18n-title="find.prev">
        ↑
      </button>
      <button id="find-next" class="tool-btn" data-i18n="find.next" data-i18n-title="find.next">
        ↓
      </button>
      <input
        id="replace-input"
        class="find-input"
        data-i18n-placeholder="find.replacePlaceholder"
        placeholder="替换为"
      />
      <button id="replace-one" class="tool-btn" data-i18n="find.replace">替换</button>
      <button id="replace-all" class="tool-btn" data-i18n="find.replaceAll">全部</button>
      <button id="find-close" class="tool-btn" data-i18n-title="find.close">✕</button>
    </div>

    <div id="link-bar" class="find-bar" hidden>
      <input
        id="link-input"
        class="find-input link-input"
        data-i18n-placeholder="linkBar.placeholder"
        placeholder="输入链接地址，回车确认"
      />
      <button id="link-ok" class="tool-btn" data-i18n="linkBar.apply">应用</button>
      <button id="link-cancel" class="tool-btn" data-i18n="linkBar.cancel">取消</button>
    </div>

    <div class="workbench">
      <aside id="sidebar" class="sidebar" hidden>
        <div id="outline-panel" class="sidebar-panel" hidden>
          <div class="sidebar-title" data-i18n="sidebar.outline">大纲</div>
          <div id="outline-list" class="outline-list"></div>
        </div>
        <div id="files-panel" class="sidebar-panel" hidden>
          <div class="sidebar-title">
            <span data-i18n="sidebar.files">文件</span>
            <button
              id="open-folder-btn"
              class="tool-btn small"
              data-i18n="toolbar.newFolder"
              title="打开文件夹"
            >
              ＋文件夹
            </button>
          </div>
          <div class="sidebar-subtitle" data-i18n="sidebar.recent">最近打开</div>
          <div id="recent-list" class="file-list"></div>
          <div class="sidebar-subtitle" id="folder-title" data-i18n="sidebar.folder">文件夹</div>
          <div id="folder-tree" class="file-list"></div>
        </div>
      </aside>

      <main class="content">
        <div id="tab-bar" class="tab-bar"></div>
        <div class="page-scroll">
          <div class="page">
            <div id="editor"></div>
            <div id="src-editor" hidden></div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
